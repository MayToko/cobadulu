<script type="module">
import * as THREE from 'three';

/* ============================ PENGATURAN ============================ */
const N = window.NASKAH;
const Q = new URLSearchParams(location.search);
const RENDER = Q.has('render');
if (RENDER) document.body.classList.add('render');
const SKALA = parseFloat(Q.get('skala') || '1');
const VERT = N.rasio === '9:16';
const W = Math.round((VERT ? 1080 : 1920) * SKALA / 2) * 2;
const H = Math.round((VERT ? 1920 : 1080) * SKALA / 2) * 2;
const FPS = N.fps || 25;
const V3 = THREE.Vector3;
const SUMBU_Z = new V3(0, 0, 1), SUMBU_Y = new V3(0, 1, 0);

/* ============================== UTIL =============================== */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0)); return t * t * (3 - 2 * t); };
const rad = d => d * Math.PI / 180;
const bungkus = a => { a = (a + Math.PI) % (2 * Math.PI); if (a < 0) a += 2 * Math.PI; return a - Math.PI; };
const lerpSudut = (a, b, t) => a + bungkus(b - a) * t;
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const amplop = (t, t0, t1, masuk = .22, keluar = .28) =>
  (t < t0 || t > t1) ? 0 : Math.min(smooth(t0, t0 + masuk, t), 1 - smooth(t1 - keluar, t1, t));

const _mat = {};
function M(warna, r = .62, extra = {}) {
  const k = warna + r + JSON.stringify(extra);
  if (!_mat[k]) _mat[k] = new THREE.MeshStandardMaterial({ color: new THREE.Color(warna), roughness: r, metalness: 0, ...extra });
  return _mat[k];
}
function mesh(geo, mat, o = {}) {
  const m = new THREE.Mesh(geo, mat);
  if (o.pos) m.position.set(...o.pos);
  if (o.rot) m.rotation.set(...o.rot);
  if (o.scl) m.scale.set(...o.scl);
  m.castShadow = o.bayangan !== false; m.receiveShadow = true;
  return m;
}
const bola = (r, s1 = 28, s2 = 20) => new THREE.SphereGeometry(r, s1, s2);

/* ============================ RENDERER ============================= */
const out = document.getElementById('layar'); out.width = W; out.height = H;
const ctx = out.getContext('2d');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(1); renderer.setSize(W, H, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const kamera = new THREE.PerspectiveCamera(35, W / H, 0.1, 500);

/* ============================ LATAR ================================ */
const WAKTU = {
  pagi:  { atas:'#76b9ff', cakrawala:'#ffe6c9', matahari:'#ffdcb0', kuat:2.5, arah:[-9, 7, 8],  hemi:['#d6ebff', '#6d8f4c', 1.0], rim:'#ffe2c4' },
  siang: { atas:'#3f9cff', cakrawala:'#d4ecff', matahari:'#fff3df', kuat:2.9, arah:[7, 13, 9],  hemi:['#dcefff', '#5e8a3d', 1.05], rim:'#d9e9ff' },
  sore:  { atas:'#5876cf', cakrawala:'#ffbf8f', matahari:'#ffc690', kuat:2.3, arah:[-11, 6, 6], hemi:['#ffe1cc', '#557a3a', 0.95], rim:'#ffc49a' }
};
const LT = N.latar || {};
const WK = WAKTU[LT.waktu || 'siang'];
scene.fog = new THREE.Fog(WK.cakrawala, 38, 170);

scene.add(new THREE.HemisphereLight(WK.hemi[0], WK.hemi[1], WK.hemi[2]));
const matahari = new THREE.DirectionalLight(WK.matahari, WK.kuat);
matahari.position.set(...WK.arah).normalize().multiplyScalar(35);
matahari.castShadow = true;
const AB = LT.areaBayangan || 15;
Object.assign(matahari.shadow.camera, { left: -AB, right: AB, top: AB, bottom: -AB, near: 1, far: 90 });
matahari.shadow.mapSize.set(RENDER ? 4096 : 2048, RENDER ? 4096 : 2048);
matahari.shadow.bias = -0.0006; matahari.shadow.normalBias = 0.04;
scene.add(matahari, matahari.target);
const rim = new THREE.DirectionalLight(WK.rim, 0.9);
rim.position.set(-WK.arah[0], 7, -14); scene.add(rim);

// Langit gradasi
scene.add(new THREE.Mesh(new THREE.SphereGeometry(320, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { atas: { value: new THREE.Color(WK.atas) }, bawah: { value: new THREE.Color(WK.cakrawala) } },
  vertexShader: `varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
  fragmentShader: `uniform vec3 atas; uniform vec3 bawah; varying vec3 vP;
    void main(){ float h = clamp(vP.y * 1.7, 0., 1.); gl_FragColor = vec4(mix(bawah, atas, pow(h, .65)), 1.);
    #include <tonemapping_fragment>
    #include <colorspace_fragment>
    }`
})));

// Tanah: halaman pasir di tengah, rumput, bukit di kejauhan
(function tanah() {
  const g = new THREE.PlaneGeometry(220, 220, 220, 220); g.rotateX(-Math.PI / 2);
  const p = g.attributes.position, col = [];
  const rumput = new THREE.Color(LT.warnaRumput || '#7bbd4c'), rumput2 = new THREE.Color('#5c9b39');
  const pasir = new THREE.Color(LT.warnaHalaman || '#e4c690'), pasir2 = new THREE.Color('#d2ad72');
  const R = LT.radiusHalaman ?? 7, c1 = new THREE.Color(), c2 = new THREE.Color(), c = new THREE.Color();
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), z = p.getZ(i), r = Math.hypot(x, z);
    const n = (Math.sin(x * .55 + Math.cos(z * .4)) * Math.cos(z * .47 - x * .13)) * .5 + .5;
    const n2 = hash(Math.floor(x * 3) * 31 + Math.floor(z * 3)) * .25;
    c1.copy(rumput).lerp(rumput2, clamp(n * .7 + n2));
    c2.copy(pasir).lerp(pasir2, clamp(n * .6 + n2 * .6));
    c.lerpColors(c2, c1, smooth(R - 1.6, R + 1.6, r + (n - .5) * 2.2));
    if (r > 26) p.setY(i, Math.pow((r - 26) / 32, 2) * 7 * (.55 + .45 * Math.sin(Math.atan2(z, x) * 5 + 1.3)));
    col.push(c.r, c.g, c.b);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3)); g.computeVertexNormals();
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: .96 }));
  m.receiveShadow = true; scene.add(m);
})();

/* ============================ PROPERTI ============================= */
const propAnim = [];
const PROP = {
  rumah(p) {
    const g = new THREE.Group(), kayuGelap = M('#6b4423', .8), dinding = M(p.warna || '#c98b52', .75),
      atap = M(p.warnaAtap || '#9c3b2e', .6), list = M('#f1e4c4', .6);
    for (const x of [-2, 0, 2]) for (const z of [-1.5, 1.5]) g.add(mesh(new THREE.CylinderGeometry(.09, .1, 1.05, 10), kayuGelap, { pos: [x, .52, z] }));
    g.add(mesh(new THREE.BoxGeometry(4.7, .16, 3.5), kayuGelap, { pos: [0, 1.08, 0] }));
    g.add(mesh(new THREE.BoxGeometry(4.4, 2.0, 3.2), dinding, { pos: [0, 2.15, 0] }));
    for (let y = 1.3; y < 3.1; y += .26) g.add(mesh(new THREE.BoxGeometry(4.43, .025, 3.23), M('#a86f3e', .8), { pos: [0, y, 0], bayangan: false }));
    g.add(mesh(new THREE.BoxGeometry(.95, 1.62, .05), list, { pos: [0, 1.93, 1.6] }));
    g.add(mesh(new THREE.BoxGeometry(.8, 1.5, .06), M('#7d4f2c', .7), { pos: [0, 1.88, 1.62] }));
    for (const x of [-1.45, 1.45]) {
      g.add(mesh(new THREE.BoxGeometry(1.0, .9, .05), list, { pos: [x, 2.35, 1.6] }));
      g.add(mesh(new THREE.BoxGeometry(.82, .72, .06), M('#2e2621', .9), { pos: [x, 2.35, 1.62] }));
      g.add(mesh(new THREE.BoxGeometry(.05, .72, .07), list, { pos: [x, 2.35, 1.63] }));
    }
    const s = new THREE.Shape(); s.moveTo(-2.75, 0); s.lineTo(2.75, 0); s.lineTo(0, 1.55); s.closePath();
    const ag = new THREE.ExtrudeGeometry(s, { depth: 4.1, bevelEnabled: false }); ag.translate(0, 0, -2.05);
    g.add(mesh(ag, atap, { pos: [0, 3.12, 0] }));
    g.add(mesh(new THREE.BoxGeometry(5.6, .12, 4.2), atap, { pos: [0, 3.12, 0] }));
    for (let i = 0; i < 4; i++) g.add(mesh(new THREE.BoxGeometry(.95, .08, .3), kayuGelap, { pos: [0, .86 - i * .24, 1.9 + i * .28] }));
    return g;
  },
  pohonKelapa(p) {
    const g = new THREE.Group(), tinggi = p.tinggi || 5.6, condong = rad(p.condong ?? (hash(p.pos[0] * 7 + p.pos[1]) * 16 - 8)),
      arahC = p.arahCondong ?? hash(p.pos[1] * 3.1) * 6.28, n = 11, titik = [];
    for (let i = 0; i <= n; i++) {
      const s = i / n, off = Math.tan(condong) * tinggi * Math.pow(s, 1.6);
      titik.push(new V3(Math.cos(arahC) * off, s * tinggi, Math.sin(arahC) * off));
    }
    for (let i = 0; i < n; i++) {
      const a = titik[i], b = titik[i + 1], d = b.clone().sub(a), L = d.length();
      const seg = mesh(new THREE.CylinderGeometry(lerp(.17, .12, (i + 1) / n), lerp(.17, .12, i / n), L * 1.04, 10),
        M(i % 2 ? '#8b6a47' : '#7c5d3d', .9));
      seg.position.copy(a).add(b).multiplyScalar(.5); seg.quaternion.setFromUnitVectors(SUMBU_Y, d.normalize()); g.add(seg);
    }
    const puncak = titik[n], daunM = M(p.warnaDaun || '#3f8f3a', .7, { side: THREE.DoubleSide });
    const segDaun = (L, w0, w1) => {
      const s = new THREE.Shape(); s.moveTo(0, 0);
      for (let j = 0; j <= 6; j++) s.lineTo(-lerp(w0, w1, j / 6) * (j % 2 ? .55 : 1), j / 6 * L);
      for (let j = 6; j >= 0; j--) s.lineTo(lerp(w0, w1, j / 6) * (j % 2 ? .55 : 1), j / 6 * L);
      const geo = new THREE.ShapeGeometry(s); geo.rotateX(Math.PI / 2); return geo;
    };
    const jumlah = 9;
    for (let k = 0; k < jumlah; k++) {
      const akar = new THREE.Group(); akar.position.copy(puncak); akar.rotation.y = k / jumlah * Math.PI * 2 + hash(k + p.pos[0]) * .4;
      let induk = akar; const L = .62;
      for (let j = 0; j < 4; j++) {
        const sg = new THREE.Group(); sg.rotation.x = j === 0 ? -.55 + hash(k * 3.3) * .3 : .38;
        if (j > 0) sg.position.z = L;
        sg.add(mesh(segDaun(L * 1.02, lerp(.3, .08, j / 4), lerp(.3, .08, (j + 1) / 4)), daunM));
        induk.add(sg); induk = sg;
      }
      g.add(akar);
    }
    for (let k = 0; k < 3; k++) g.add(mesh(bola(.12, 12, 10), M('#6e7d2b', .6), { pos: [puncak.x + Math.cos(k * 2.1) * .16, puncak.y - .14, puncak.z + Math.sin(k * 2.1) * .16] }));
    return g;
  },
  pohonRindang(p) {
    const g = new THREE.Group(), s = p.skala || 1;
    g.add(mesh(new THREE.CylinderGeometry(.22 * s, .32 * s, 2.4 * s, 12), M('#6e4b2e', .9), { pos: [0, 1.2 * s, 0] }));
    const hijau = ['#3f8c3c', '#4e9d43', '#367a35', '#5aa84a'];
    for (let i = 0; i < 7; i++) {
      const a = i / 7 * 6.28, r = i === 6 ? 0 : 1.0 * s;
      g.add(mesh(bola((1.0 + hash(i + p.pos[0]) * .5) * s, 20, 16), M(hijau[i % 4], .85), { pos: [Math.cos(a) * r, (3.0 + (i === 6 ? .8 : hash(i) * .5)) * s, Math.sin(a) * r] }));
    }
    return g;
  },
  semak(p) {
    const g = new THREE.Group(), s = p.skala || 1;
    for (let i = 0; i < 4; i++) g.add(mesh(bola((.35 + hash(i + p.pos[0]) * .25) * s, 16, 12), M(i % 2 ? '#4f9a3f' : '#3e8635', .85),
      { pos: [(i - 1.5) * .38 * s, .25 * s, hash(i * 9 + p.pos[1]) * .3 * s] }));
    return g;
  },
  bunga(p) {
    const g = new THREE.Group(), warna = ['#ff5a6e', '#ffd23f', '#ff8fd0', '#ffffff', '#ff9a3c'];
    for (let i = 0; i < 7; i++) {
      const x = (hash(i * 3 + p.pos[0]) - .5) * .9, z = (hash(i * 5 + p.pos[1]) - .5) * .6, h = .25 + hash(i) * .2;
      g.add(mesh(new THREE.CylinderGeometry(.012, .012, h, 5), M('#3b7d2c'), { pos: [x, h / 2, z] }));
      g.add(mesh(bola(.06, 10, 8), M(warna[i % 5], .5), { pos: [x, h, z] }));
    }
    return g;
  },
  batu(p) { const s = p.skala || 1; return mesh(new THREE.DodecahedronGeometry(.4 * s), M('#9a958c', .95), { pos: [0, .2 * s, 0], scl: [1.3, .7, 1] }); },
  pagar(p) {
    const g = new THREE.Group(), [x0, z0] = p.dari, [x1, z1] = p.ke, L = Math.hypot(x1 - x0, z1 - z0), kayu = M(p.warna || '#c49a6c', .85);
    const ang = Math.atan2(x1 - x0, z1 - z0);
    for (let s = 0; s <= L; s += .36) g.add(mesh(new THREE.BoxGeometry(.09, .85, .05), kayu, { pos: [x0 + Math.sin(ang) * s, .42, z0 + Math.cos(ang) * s], rot: [0, ang + Math.PI / 2, 0] }));
    for (const y of [.25, .62]) g.add(mesh(new THREE.BoxGeometry(.05, .07, L), kayu, { pos: [(x0 + x1) / 2, y, (z0 + z1) / 2], rot: [0, ang, 0] }));
    p.pos = [0, 0]; return g;
  },
  bangku(p) {
    const g = new THREE.Group(), k = M(p.warna || '#9c6b3f', .8);
    g.add(mesh(new THREE.BoxGeometry(1.5, .08, .42), k, { pos: [0, .45, 0] }));
    for (const x of [-.62, .62]) for (const z of [-.15, .15]) g.add(mesh(new THREE.BoxGeometry(.07, .45, .07), k, { pos: [x, .22, z] }));
    return g;
  },
  bola(p) {
    const g = new THREE.Group();
    g.add(mesh(bola(.13), M('#ffffff', .4), { pos: [0, .13, 0] }));
    g.add(mesh(new THREE.TorusGeometry(.13, .022, 8, 24), M(p.warna || '#e63946', .4), { pos: [0, .13, 0], rot: [0, .6, 0] }));
    return g;
  },
  ayam(p) {
    const g = new THREE.Group(), badan = new THREE.Group(), warna = p.warna || '#f6f2ea';
    badan.add(mesh(bola(.18), M(warna, .8), { pos: [0, .3, 0], scl: [1, .9, 1.25] }));

/* ============================= TOKOH =============================== */
const PROPORSI = {
  anak:   { kepalaR: .34, pinggulY: .40, torsoH: .36, torsoR: .19, lenganP: .36, lenganR: .055, kakiR: .068, kec: 1.0, lari: 2.6, langkah: .5 },

};

function buatTokoh(d, indeks) {
  const P = PROPORSI[d.jenis || 'anak'], R = P.kepalaR, dewasa = d.jenis === 'dewasa';
  const kulit = M(d.kulit || '#e9b48a', .5), baju = M(d.baju || '#e8553e', .7), celana = M(d.celana || '#2f4f8f', .75),
    sepatu = M(d.sepatu || '#ffffff', .5), rambutM = M(d.warnaRambut || '#2a1b14', .7);
  const lenganPanjang = d.lenganPanjang ?? (dewasa || d.rambut === 'tudung');
  const celanaPanjang = d.celanaPanjang ?? dewasa;
  const root = new THREE.Group(), tubuh = new THREE.Group(), pinggul = new THREE.Group();
  root.add(tubuh); tubuh.add(pinggul); pinggul.position.y = P.pinggulY;
  root.scale.setScalar(d.skala || 1);

  // Torso & celana
  const tH = P.torsoH + .05;
  pinggul.add(mesh(new THREE.CapsuleGeometry(P.torsoR, Math.max(.01, tH - 2 * P.torsoR), 8, 24), baju, { pos: [0, (P.torsoH - .05) / 2, 0], scl: [1, 1, .84] }));
  if (d.rok) pinggul.add(mesh(new THREE.CylinderGeometry(P.torsoR * 1.02, P.torsoR * 1.55, .3, 28), M(d.rok, .7), { pos: [0, -.08, 0], scl: [1, 1, .9] }));
  else pinggul.add(mesh(new THREE.CylinderGeometry(P.torsoR * 1.01, P.torsoR * 1.07, .17, 24), celana, { pos: [0, -.01, 0], scl: [1, 1, .86] }));

  // Kepala
  const kepala = new THREE.Group(); kepala.position.y = P.torsoH; pinggul.add(kepala);
  const kepalaM = mesh(bola(R, 44, 34), kulit, { pos: [0, R * .9, 0], scl: [1.03, .98, 1] }); kepala.add(kepalaM);
  const diKepala = (obj, yaw, pitch, dorong = 1) => {
    const luar = new THREE.Group(), dir = new V3(Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), Math.cos(yaw) * Math.cos(pitch));
    luar.position.copy(dir).multiplyScalar(R * dorong); luar.quaternion.setFromUnitVectors(SUMBU_Z, dir);
    luar.add(obj); kepalaM.add(luar); return obj;
  };
  // Mata (sisi -1 = kanan tokoh, +1 = kiri tokoh)
  const mata = [];
  for (const s of [-1, 1]) {
    const grup = new THREE.Group(), pupil = new THREE.Group();
    grup.add(mesh(bola(R * .19, 24, 18), M('#ffffff', .25), { scl: [.84, 1.1, .5], bayangan: false }));
    pupil.position.z = R * .055;
    pupil.add(mesh(bola(R * .115, 20, 16), M(d.warnaMata || '#2b1a12', .3), { scl: [1, 1.12, .5], bayangan: false }));
    pupil.add(mesh(bola(R * .032, 10, 8), M('#ffffff', .2, { emissive: new THREE.Color('#ffffff'), emissiveIntensity: .6 }), { pos: [R * .04, R * .05, R * .05], bayangan: false }));
    grup.add(pupil); diKepala(grup, s * .33, .06, .92);
    mata.push({ grup, pupil });
  }
  // Alis
  const alis = [];
  for (const s of [-1, 1]) {
    const a = mesh(new THREE.CapsuleGeometry(R * .024, R * .13, 4, 8), M(d.rambut === 'peci' && d.warnaRambut ? d.warnaRambut : (d.warnaRambut || '#2a1b14'), .7), { rot: [0, 0, Math.PI / 2], bayangan: false });
    const g = new THREE.Group(); g.add(a); diKepala(g, s * .33, .31, .985); alis.push(g);
  }
  // Hidung, pipi, telinga
  diKepala(mesh(bola(R * .065, 14, 10), M(d.kulit || '#e9b48a', .45), { scl: [1, .8, .8], bayangan: false }), 0, -.07, .985);
  const pipiM = new THREE.MeshStandardMaterial({ color: '#ff8a8a', transparent: true, opacity: .4, roughness: .6, depthWrite: false });
  const pipi = [];
  for (const s of [-1, 1]) pipi.push(diKepala(mesh(bola(R * .09, 14, 10), pipiM, { scl: [1.1, .62, .3], bayangan: false }), s * .55, -.13, .975));
  if (d.rambut !== 'tudung') for (const s of [-1, 1]) diKepala(mesh(bola(R * .15, 14, 10), kulit, { scl: [.5, 1, .8] }), s * 1.55, .02, .95);

  // Mulut
  const mulutG = diKepala(new THREE.Group(), 0, -.3, .975);
  const mulutGelap = M('#5b2420', .5);
  const senyum = mesh(new THREE.TorusGeometry(R * .11, R * .022, 8, 20, Math.PI), mulutGelap, { rot: [0, 0, Math.PI], pos: [0, R * .05, 0], bayangan: false });
  const cemberut = mesh(new THREE.TorusGeometry(R * .09, R * .02, 8, 20, Math.PI), mulutGelap, { pos: [0, -R * .07, 0], bayangan: false });
  const buka = new THREE.Group();
  buka.add(mesh(bola(R * .1, 20, 14), M('#6e1f1f', .6), { scl: [1.25, 1, .35], bayangan: false }));
  buka.add(mesh(bola(R * .06, 14, 10), M('#e0707a', .6), { pos: [0, -R * .045, R * .012], scl: [1.3, .6, .4], bayangan: false }));
  buka.add(mesh(new THREE.BoxGeometry(R * .14, R * .03, R * .02), M('#ffffff', .3), { pos: [0, R * .075, R * .02], bayangan: false }));
  mulutG.add(senyum, cemberut, buka);

  // Rambut / penutup kepala (desain orisinal)
  const tutup = (r, phiS, phiL, thS, thL, mat) => mesh(new THREE.SphereGeometry(r, 40, 24, phiS, phiL, thS, thL), mat, { pos: [0, 0, 0] });
  const gaya = d.rambut || 'pendek';
  if (gaya === 'pendek' || gaya === 'jabrik' || gaya === 'kuncir') {
    const atas = tutup(R * 1.05, 0, Math.PI * 2, 0, Math.PI * .43, rambutM); atas.rotation.x = -.22; kepalaM.add(atas);
    kepalaM.add(tutup(R * 1.04, Math.PI - .15, Math.PI + .3, 0, Math.PI * (gaya === 'kuncir' ? .75 : .58), rambutM));
    for (let i = 0; i < 5; i++) diKepala(mesh(bola(R * .17, 14, 10), rambutM, { scl: [1, .7, .6] }), (i - 2) * .24, .52 + Math.abs(i - 2) * .02, .99);
    if (gaya === 'jabrik') for (let i = 0; i < 8; i++) {
      const yaw = (i / 8) * Math.PI * 2, pitch = .95 + (i % 2) * .25;
      const dir = new V3(Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), Math.cos(yaw) * Math.cos(pitch));
      const k = mesh(new THREE.ConeGeometry(R * .15, R * .42, 10), rambutM);
      k.position.copy(dir).multiplyScalar(R * 1.08); k.quaternion.setFromUnitVectors(SUMBU_Y, dir.clone().add(new V3(0, .6, -.3)).normalize()); kepalaM.add(k);
    }
    if (gaya === 'kuncir') for (const s of [-1, 1]) {
      diKepala(mesh(bola(R * .28, 18, 14), rambutM), s * 1.75, .05, 1.18);
      diKepala(mesh(new THREE.TorusGeometry(R * .1, R * .04, 8, 16), M(d.pita || '#ff5c8a', .5)), s * 1.5, .12, 1.08);
    }
  } else if (gaya === 'tudung') {
    const tm = M(d.tudung || '#f48fb1', .75, { side: THREE.DoubleSide });
    kepalaM.add(tutup(R * 1.09, 0, Math.PI * 2, 0, Math.PI * .34, tm));
    kepalaM.add(tutup(R * 1.09, Math.PI / 2 + .72, Math.PI * 2 - 1.44, Math.PI * .33, Math.PI * .52, tm));
    kepala.add(mesh(new THREE.CylinderGeometry(R * .8, P.torsoR * 1.75, R * 1.05, 36, 1, true), tm, { pos: [0, -R * .05, 0], scl: [1, 1, .9] }));
  } else if (gaya === 'peci') {
    kepalaM.add(tutup(R * 1.03, Math.PI - .5, Math.PI + 1.0, Math.PI * .3, Math.PI * .35, rambutM));
    kepalaM.add(mesh(new THREE.CylinderGeometry(R * .8, R * .84, R * .5, 32), M(d.warnaPeci || '#1d1d22', .55), { pos: [0, R * .78, -R * .05], rot: [-.12, 0, 0] }));
  }
  if (d.kumis) for (const s of [-1, 1]) diKepala(mesh(new THREE.CapsuleGeometry(R * .035, R * .12, 4, 8), M(d.warnaRambut || '#3a2a20', .7), { rot: [0, 0, Math.PI / 2 + s * .35], bayangan: false }), s * .12, -.19, 1.0);
  if (d.kacamata) {
    const km = M('#2a2a2a', .4);
    for (const s of [-1, 1]) diKepala(mesh(new THREE.TorusGeometry(R * .2, R * .022, 8, 24), km, { bayangan: false }), s * .33, .06, 1.03);
    diKepala(mesh(new THREE.BoxGeometry(R * .14, R * .025, R * .02), km, { bayangan: false }), 0, .08, 1.06);
  }

  // Lengan
  const bahu = [];
  for (const s of [-1, 1]) {
    const b = new THREE.Group(); b.position.set(s * (P.torsoR + .035), P.torsoH - .07, 0);
    b.add(mesh(bola(P.lenganR * 1.55, 14, 10), baju));
    b.add(mesh(new THREE.CapsuleGeometry(P.lenganR, P.lenganP - 2 * P.lenganR, 6, 12), lenganPanjang ? baju : kulit, { pos: [0, -P.lenganP / 2, 0] }));
    if (!lenganPanjang) b.add(mesh(new THREE.CylinderGeometry(P.lenganR * 1.4, P.lenganR * 1.5, P.lenganP * .38, 14), baju, { pos: [0, -P.lenganP * .17, 0] }));
    b.add(mesh(bola(P.lenganR * 1.45, 14, 10), kulit, { pos: [0, -P.lenganP, 0] }));
    pinggul.add(b); bahu.push(b);
  }
  // Kaki
  const kaki = [], kakiL = P.pinggulY - .06;
  for (const s of [-1, 1]) {
    const k = new THREE.Group(); k.position.set(s * P.torsoR * .48, 0, 0);
    k.add(mesh(new THREE.CapsuleGeometry(P.kakiR, kakiL - 2 * P.kakiR, 6, 12), celanaPanjang ? celana : kulit, { pos: [0, -kakiL / 2, 0] }));
    if (!celanaPanjang && !d.rok) k.add(mesh(new THREE.CylinderGeometry(P.kakiR * 1.55, P.kakiR * 1.6, .1, 14), celana, { pos: [0, -.06, 0] }));
    k.add(mesh(bola(P.kakiR * 1.5, 14, 10), sepatu, { pos: [0, -P.pinggulY + .045, .045], scl: [1, .62, 1.65] }));
    pinggul.add(k); kaki.push(k);
  }

  const tinggiKepala = (P.pinggulY + P.torsoH + R * .9) * (d.skala || 1);
  return { d, P, R, root, tubuh, pinggul, kepala, mata, alis, pipi, pipiM, senyum, cemberut, buka, bahu, kaki,
    tinggiKepala, dewasa, seed: indeks * 1.913 + 0.37, jalur: [], kunciArah: [], kunciEkspresi: [], bicara: [], gerak: [], lihat: [] };
}

/* ===================== TOKOH GAYA BALOK (avatar blok) ===================== */
// Kotak dengan sudut membulat (normal halus), untuk badan/lengan/kaki gaya avatar blok.
function kotakBalok(w, h, d, r, seg = 16) {
  const g = new THREE.BoxGeometry(w, h, d, seg, seg, seg), p = g.attributes.position, n = g.attributes.normal;
  const hx = w / 2 - r, hy = h / 2 - r, hz = d / 2 - r, v = new V3(), c = new V3(), df = new V3();
  const remap = (x, half, inner) => { const s = x / half, a = Math.abs(s); return Math.sign(s) * (a <= .5 ? a / .5 * inner : inner + (a - .5) / .5 * r); };
  for (let i = 0; i < p.count; i++) {
    v.set(remap(p.getX(i), w / 2, hx), remap(p.getY(i), h / 2, hy), remap(p.getZ(i), d / 2, hz));
    c.set(clamp(v.x, -hx, hx), clamp(v.y, -hy, hy), clamp(v.z, -hz, hz)); df.copy(v).sub(c);
    if (df.lengthSq() > 1e-12) { df.normalize(); v.copy(c).addScaledVector(df, r); n.setXYZ(i, df.x, df.y, df.z); }
    p.setXYZ(i, v.x, v.y, v.z);
  }
  return g;
}
// Kepala silinder bersudut bulat (siluet khas avatar blok).
function kepalaSilinder(r, h, c) {
  const pts = [new THREE.Vector2(0, -h / 2)];
  for (let i = 0; i <= 8; i++) { const a = -Math.PI / 2 + i / 8 * Math.PI / 2; pts.push(new THREE.Vector2(r - c + Math.cos(a) * c, -h / 2 + c + Math.sin(a) * c)); }
  for (let i = 0; i <= 8; i++) { const a = i / 8 * Math.PI / 2; pts.push(new THREE.Vector2(r - c + Math.cos(a) * c, h / 2 - c + Math.sin(a) * c)); }
  pts.push(new THREE.Vector2(0, h / 2));
  return new THREE.LatheGeometry(pts, 56);
}
function teksurTeks(teks, warna = '#ffffff', garis = 'rgba(0,0,0,.35)') {
  const cv = document.createElement('canvas'); cv.width = 512; cv.height = 192;
  const c = cv.getContext('2d'); let fs = 132;
  do { c.font = `900 ${fs}px "Arial Black","Segoe UI Black",Impact,"Helvetica Neue",sans-serif`; fs -= 6; } while (c.measureText(teks).width > 470 && fs > 40);
  c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round';
  c.lineWidth = 10; c.strokeStyle = garis; c.strokeText(teks, 256, 100); c.fillStyle = warna; c.fillText(teks, 256, 100);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}

    return { o: o * tutupAkhir * (.85 + .15 * Math.sin(t * 23 + k.seed)), l, aktif: true, lt: t - b.t0 };
  }
  return { o: 0, l: 1, aktif: false };
}

const GERAK = {
  lambai(k, lt, d, e) { const [kn] = k.bahu; kn.rotation.z = lerp(kn.rotation.z, -2.55 + Math.sin(lt * 11) * .32, e); kn.rotation.x = lerp(kn.rotation.x, -.25, e); k.kepala.rotation.z += .12 * e; },
  sorak(k, lt, d, e, x) { const [kn, kr] = k.bahu; kn.rotation.z = lerp(kn.rotation.z, -2.7 + Math.sin(lt * 13) * .15, e); kr.rotation.z = lerp(kr.rotation.z, 2.7 - Math.sin(lt * 13 + 1) * .15, e);
    k.tubuh.position.y += Math.abs(Math.sin(lt * 8)) * .07 * e; x.mulut = Math.max(x.mulut, .7 * e); x.senang = Math.max(x.senang, e); },
  tunjuk(k, lt, d, e) { const [kn] = k.bahu; kn.rotation.x = lerp(kn.rotation.x, -1.45, e); kn.rotation.z = lerp(kn.rotation.z, -.12, e); k.kepala.rotation.y += .15 * e; },
  angguk(k, lt, d, e) { k.kepala.rotation.x += (.1 + Math.sin(lt * 9) * .16) * e; },
  geleng(k, lt, d, e) { k.kepala.rotation.y += Math.sin(lt * 10) * .35 * e; },
  lompat(k, lt, d, e, x) {
    const u = clamp(lt / d), tb = k.tubuh, [kn, kr] = k.bahu;
    if (u < .22) { const s = Math.sin(u / .22 * Math.PI / 2); tb.scale.y *= 1 - .17 * s; tb.scale.x *= 1 + .09 * s; tb.scale.z *= 1 + .09 * s; }
    else if (u < .78) { const v = (u - .22) / .56; tb.position.y += 4 * v * (1 - v) * (k.dewasa ? .3 : .42); const st = 1 - Math.abs(2 * v - 1);
      tb.scale.y *= 1 + .1 * st; tb.scale.x *= 1 - .05 * st; tb.scale.z *= 1 - .05 * st;
      kn.rotation.z = lerp(kn.rotation.z, -2.2, st); kr.rotation.z = lerp(kr.rotation.z, 2.2, st); for (const kk of k.kaki) kk.rotation.x -= .35 * st; }
    else { const s = Math.sin((u - .78) / .22 * Math.PI); tb.scale.y *= 1 - .13 * s; tb.scale.x *= 1 + .07 * s; tb.scale.z *= 1 + .07 * s; }
    x.senang = Math.max(x.senang, e);
  },
  ketawa(k, lt, d, e, x) { k.kepala.rotation.x -= .25 * e; k.tubuh.rotation.x -= .07 * e; k.tubuh.position.y += Math.abs(Math.sin(lt * 16)) * .02 * e;
    const [kn, kr] = k.bahu; kn.rotation.x = lerp(kn.rotation.x, -.7, e); kr.rotation.x = lerp(kr.rotation.x, -.7, e); kn.rotation.z = lerp(kn.rotation.z, .25, e); kr.rotation.z = lerp(kr.rotation.z, -.25, e);
    x.mulut = Math.max(x.mulut, (.75 + Math.sin(lt * 16) * .2) * e); x.senang = Math.max(x.senang, e); x.sipit = Math.max(x.sipit, e); },
  pikir(k, lt, d, e, x) { const [kn] = k.bahu, balok = k.d.gaya === 'balok'; kn.rotation.x = lerp(kn.rotation.x, balok ? -1.25 : -1.85, e); kn.rotation.z = lerp(kn.rotation.z, balok ? .35 : .5, e);
    k.kepala.rotation.z += .18 * e; k.kepala.rotation.x -= .08 * e; x.pupil = [lerp(x.pupil[0], .45, e), lerp(x.pupil[1], .6, e)]; },
  kaget(k, lt, d, e, x) { const u = clamp(lt / d); if (u < .3) k.tubuh.position.y += Math.sin(u / .3 * Math.PI) * .12;
    const [kn, kr] = k.bahu; kn.rotation.z = lerp(kn.rotation.z, -1.1, e); kr.rotation.z = lerp(kr.rotation.z, 1.1, e); kn.rotation.x = lerp(kn.rotation.x, -.4, e); kr.rotation.x = lerp(kr.rotation.x, -.4, e);
    k.tubuh.rotation.x -= .1 * e; x.mataBesar = Math.max(x.mataBesar, e); x.mulut = Math.max(x.mulut, .55 * e); },
  tepuk(k, lt, d, e, x) { const [kn, kr] = k.bahu, c = .32 + .14 * Math.sin(lt * 16);
    kn.rotation.x = lerp(kn.rotation.x, -1.25, e); kr.rotation.x = lerp(kr.rotation.x, -1.25, e); kn.rotation.z = lerp(kn.rotation.z, c, e); kr.rotation.z = lerp(kr.rotation.z, -c, e); x.senang = Math.max(x.senang, e); },
  garuk(k, lt, d, e) { const [kn] = k.bahu; kn.rotation.x = lerp(kn.rotation.x, -2.45, e); kn.rotation.z = lerp(kn.rotation.z, -.55 + Math.sin(lt * 15) * .09, e); k.kepala.rotation.z -= .13 * e; },
  sedih(k, lt, d, e) { k.kepala.rotation.x += .3 * e; k.tubuh.rotation.x += .08 * e; for (const b of k.bahu) b.rotation.x = lerp(b.rotation.x, .12, e); },
  bicaraTangan(k, lt, d, e) { const [kn, kr] = k.bahu; kn.rotation.x = lerp(kn.rotation.x, -.55 + Math.sin(lt * 4) * .22, e); kn.rotation.z = lerp(kn.rotation.z, -.28, e);
    kr.rotation.x = lerp(kr.rotation.x, -.35 + Math.sin(lt * 3.3 + 1) * .18, e); kr.rotation.z = lerp(kr.rotation.z, .22, e); },
  pinggang(k, lt, d, e) { const [kn, kr] = k.bahu; kn.rotation.z = lerp(kn.rotation.z, -.75, e); kr.rotation.z = lerp(kr.rotation.z, .75, e); kn.rotation.x = lerp(kn.rotation.x, .35, e); kr.rotation.x = lerp(kr.rotation.x, .35, e); k.kepala.rotation.z += .1 * e; },
  menari(k, lt, d, e, x) { const [kn, kr] = k.bahu; k.tubuh.rotation.z += Math.sin(lt * 6) * .14 * e; k.tubuh.position.y += Math.abs(Math.sin(lt * 6)) * .05 * e;
    kn.rotation.z = lerp(kn.rotation.z, -1.5 + Math.sin(lt * 6) * .7, e); kr.rotation.z = lerp(kr.rotation.z, 1.5 + Math.sin(lt * 6) * .7, e); k.kepala.rotation.z -= Math.sin(lt * 6) * .1 * e; x.senang = Math.max(x.senang, e); }
};

function poseTokoh(k, t) {
  const { tubuh, kepala, bahu, kaki, mata, alis } = k, s = k.seed;
  const p = posisiPada(k, t);
  k.root.position.set(p.x, 0, p.z); k.root.rotation.y = yawPada(k, t);
  tubuh.position.set(0, 0, 0); tubuh.rotation.set(0, 0, 0);
  const nafas = Math.sin(t * 2.1 + s) * .5 + .5;
  tubuh.scale.set(1 - nafas * .006, 1 + nafas * .013, 1 - nafas * .006);
  tubuh.rotation.z = Math.sin(t * .9 + s) * .014;
  kepala.rotation.set(Math.sin(t * .55 + s) * .02, Math.sin(t * .37 + s * 2) * .04, Math.sin(t * .7 + s * 3) * .03);
  const rest = k.lenganRest ?? .2;
  bahu[0].rotation.set(Math.sin(t * 1.1 + s) * .03, 0, -rest); bahu[1].rotation.set(Math.sin(t * 1.1 + s + 1) * .03, 0, rest);
  for (const kk of kaki) kk.rotation.set(0, 0, 0);
  const x = { mulut: 0, senang: 0, sipit: 0, mataBesar: 0, pupil: [0, 0] };

  // Jalan / lari
  for (const j of k.jalur) if (t >= j.t0 && t <= j.t1) {
    const amp = Math.min(smooth(j.t0, j.t0 + .22, t), 1 - smooth(j.t1 - .22, j.t1, t));
    const u = (t - j.t0) / (j.t1 - j.t0), fase = lerp(u, ease(u), .45) * j.dist / (k.P.langkah * (j.lari ? 1.5 : 1)) * Math.PI * 2;
    const ay = Math.sin(fase) * (j.lari ? .95 : .55) * amp;
    kaki[0].rotation.x = ay; kaki[1].rotation.x = -ay; bahu[0].rotation.x = -ay * .85; bahu[1].rotation.x = ay * .85;
    tubuh.position.y += Math.abs(Math.cos(fase)) * (j.lari ? .07 : .03) * amp;
    tubuh.rotation.x += (j.lari ? .2 : .05) * amp; tubuh.rotation.z += Math.sin(fase) * .03 * amp;
  }
  // Bicara: kepala & tangan ikut bicara bila tak ada gerak lain
  const m = bukaMulut(k, t);
  const adaGerak = k.gerak.some(g => t >= g.t0 && t <= g.t1);
  if (m.aktif) {
    kepala.rotation.x += Math.sin(m.lt * 5.3 + s) * .045; kepala.rotation.y += Math.sin(m.lt * 2.6 + s) * .05;
    if (!adaGerak && !k.jalur.some(j => t >= j.t0 && t <= j.t1)) {
      let b0 = 0; for (const b of k.bicara) if (t >= b.t0 && t < b.t1) b0 = b.t0;
      GERAK.bicaraTangan(k, m.lt, 1, amplop(t, b0, b0 + 99, .35, .3) * .55 * (1 - smooth(-.4, 0, t - (k.bicara.find(b => b.t0 === b0).t1))), x);
    }
  }
  // Gerak (lapis)
  for (const g of k.gerak) if (t >= g.t0 && t <= g.t1) {
    const f = GERAK[g.nama]; if (!f) continue;
    f(k, t - g.t0, g.t1 - g.t0, amplop(t, g.t0, g.t1), x);
  }
  // Lihat (kepala + pupil)
  const [ly, lp] = lihatHalus(k, t);
  kepala.rotation.y += ly * .75; kepala.rotation.x -= lp * .6;
  x.pupil[0] += ly * .5; x.pupil[1] += lp * .8;

  // Ekspresi
  const ek = ekspresiPada(k, t), R = k.R;
  let alisY = 0, alisMiring = 0, mataS = 1, modeMulut = 'senyum', senyumY = 1, merah = k.pipiDasar ?? .4, asimetri = 0;
  switch (ek) {
    case 'senang': break;
    case 'netral': senyumY = .45; break;
    case 'sedih': alisMiring = .38; modeMulut = 'cemberut'; mataS = .9; kepala.rotation.x += .08; break;
    case 'marah': alisMiring = -.42; alisY = -.035; modeMulut = 'cemberut'; mataS = .86; break;
    case 'kaget': alisY = .06; mataS = 1.22; x.mulut = Math.max(x.mulut, .5); break;
    case 'malu': merah = .9; x.pupil[1] -= .4; senyumY = .7; break;
    case 'bingung': asimetri = 1; senyumY = .3; break;
  }
  if (x.mataBesar) { mataS = lerp(mataS, 1.25, x.mataBesar); alisY = lerp(alisY, .06, x.mataBesar); }
  if (x.senang) { modeMulut = 'senyum'; senyumY = lerp(senyumY, 1, x.senang); }
  k.pipiM.opacity = merah;
  alis.forEach((a, i) => {
    const sisi = i === 0 ? -1 : 1;
    a.position.y = R * (alisY + (asimetri && sisi === 1 ? .05 : 0) + Math.sin(t * 1.3 + s) * .004 + (m.aktif ? Math.max(0, Math.sin(m.lt * 4)) * .015 : 0));
    a.rotation.z = -sisi * alisMiring + (asimetri && sisi === 1 ? .25 : 0);
  });
  // Kedip
  let kedip = 0; const per = 3.3, nn = Math.floor(t / per);
  for (const q of [nn - 1, nn]) { const tb = q * per + hash(q * 7.1 + s * 13) * 1.6, dd = t - tb; if (dd >= 0 && dd < .16) kedip = Math.max(kedip, Math.sin(dd / .16 * Math.PI)); }
  const sipit = Math.max(x.sipit, 0);
  for (const mm of mata) {
    mm.grup.scale.set(mataS, mataS * Math.max(.08, 1 - .92 * kedip) * (1 - .78 * sipit), mataS);
    mm.pupil.position.x = clamp(x.pupil[0], -1, 1) * R * .05; mm.pupil.position.y = clamp(x.pupil[1], -1, 1) * R * .05;
  }
  // Mulut
  const o = Math.max(m.o, x.mulut);
  if (o > .07) {
    k.buka.visible = true; k.senyum.visible = k.cemberut.visible = false;
    k.buka.scale.set(lerp(1, m.aktif ? m.l : 1, .8) * (1 + o * .1), .18 + o * 1.05, 1);
  } else {
    k.buka.visible = false; k.senyum.visible = modeMulut === 'senyum'; k.cemberut.visible = modeMulut === 'cemberut';
    k.senyum.scale.set(1, senyumY, 1);
  }
}

/* ============================ OVERLAY ============================== */
const FONT = `"Baloo 2","Fredoka","Nunito","Trebuchet MS","Segoe UI",sans-serif`;
function bungkusTeks(teks, maks) {
  const kata = teks.split(' '), baris = []; let b = '';
  for (const w of kata) { const c = b ? b + ' ' + w : w; if (ctx.measureText(c).width > maks && b) { baris.push(b); b = w; } else b = c; }
  if (b) baris.push(b); return baris;
}
function kotakBulat(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }
function overlay(t) {
  const U = Math.min(W, H);
  // Teks percakapan
  const aktif = [];
  for (const k of daftar) for (const b of k.bicara) if (t >= b.t0 && t < b.t1 + .25) aktif.push({ k, b });
  aktif.sort((p, q) => p.b.t0 - q.b.t0);
  const tampil = aktif.slice(-2);
  let yDasar = H - U * (VERT ? .2 : .07);
  for (let i = tampil.length - 1; i >= 0; i--) {
    const { k, b } = tampil[i], fs = U * (VERT ? .05 : .045);
    const a = Math.min(smooth(b.t0, b.t0 + .12, t), 1 - smooth(b.t1 + .1, b.t1 + .25, t));
    ctx.save(); ctx.globalAlpha = a; ctx.font = `700 ${fs}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const baris = bungkusTeks(b.teks, W * .78), lh = fs * 1.22, nama = (k.d.nama || k.d.id).toUpperCase();
    const lebar = Math.max(...baris.map(s => ctx.measureText(s).width)) + fs * 1.4, tinggi = baris.length * lh + fs * .8;
    const x0 = W / 2 - lebar / 2, y0 = yDasar - tinggi;
    ctx.fillStyle = 'rgba(12,14,22,.72)'; kotakBulat(x0, y0, lebar, tinggi, fs * .45); ctx.fill();
    ctx.font = `800 ${fs * .62}px ${FONT}`; const ln = ctx.measureText(nama).width + fs * .9;
    ctx.fillStyle = k.d.warnaNama || k.d.baju || '#ffb547'; kotakBulat(x0 + fs * .4, y0 - fs * .55, ln, fs * .78, fs * .3); ctx.fill();
    ctx.fillStyle = '#16131a'; ctx.fillText(nama, x0 + fs * .4 + ln / 2, y0 - fs * .55 + fs * .4);
    ctx.font = `700 ${fs}px ${FONT}`; ctx.fillStyle = '#ffffff';
    baris.forEach((s, j) => ctx.fillText(s, W / 2, y0 + fs * .4 + lh * (j + .5)));
    ctx.restore(); yDasar = y0 - fs * 1.0;
  }
  // Transisi pudar
  let gelap = 0;
  for (let i = 0; i < adegan.length; i++) {
    const a = adegan[i];
    if (a.transisi !== 'pudar') continue;
    if (t >= a.mulai && t < a.mulai + .45) gelap = Math.max(gelap, 1 - smooth(a.mulai, a.mulai + .45, t));
    if (i > 0 && t >= a.mulai - .35 && t < a.mulai) gelap = Math.max(gelap, smooth(a.mulai - .35, a.mulai, t));
  }
  if (N.kartuAkhir) gelap = Math.max(gelap, smooth(DURASI - 2.2, DURASI - 1.4, t) * .55);
  if (gelap > 0) { ctx.fillStyle = `rgba(0,0,0,${gelap})`; ctx.fillRect(0, 0, W, H); }
  // Kartu judul
  if (N.kartuJudul && N.judul && t < 3.4) {
    const a = 1 - smooth(2.5, 3.3, t), sk = 1 + smooth(0, 3.3, t) * .05;
    ctx.save(); ctx.globalAlpha = a;
    const gr = ctx.createLinearGradient(0, H * .25, 0, H * .75); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(.5, 'rgba(0,0,0,.42)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
    ctx.translate(W / 2, H / 2); ctx.scale(sk, sk); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const fs = U * (VERT ? .085 : .1); ctx.font = `800 ${fs}px ${FONT}`; ctx.lineJoin = 'round';
    const baris = bungkusTeks(N.judul, W * .85);
    baris.forEach((s, j) => { const y = (j - (baris.length - 1) / 2) * fs * 1.1 - fs * .2;
      ctx.lineWidth = fs * .16; ctx.strokeStyle = '#3b1d0e'; ctx.strokeText(s, 0, y); ctx.fillStyle = '#ffd23f'; ctx.fillText(s, 0, y); });
    if (N.subjudul) { ctx.font = `700 ${fs * .38}px ${FONT}`; ctx.fillStyle = '#ffffff'; ctx.fillText(N.subjudul, 0, baris.length * fs * .55 + fs * .25); }
    ctx.restore();
  }
  // Kartu akhir
  if (N.kartuAkhir && t > DURASI - 2) {
    const a = smooth(DURASI - 1.9, DURASI - 1.2, t), fs = U * .11;
    ctx.save(); ctx.globalAlpha = a; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = `800 ${fs}px ${FONT}`; ctx.lineJoin = 'round';
    ctx.translate(W / 2, H / 2); ctx.scale(1 + (1 - a) * .2, 1 + (1 - a) * .2);
    ctx.lineWidth = fs * .16; ctx.strokeStyle = '#3b1d0e'; ctx.strokeText(N.kartuAkhir, 0, 0); ctx.fillStyle = '#ffffff'; ctx.fillText(N.kartuAkhir, 0, 0);
    ctx.restore();
  }
}

/* ============================= BINGKAI ============================= */
function frame(t) {
  t = clamp(t, 0, DURASI);
  for (const f of propAnim) f(t);
  for (const a of awan) a.g.position.x = a.x0 + t * .4;
  for (const k of daftar) poseTokoh(k, t);
  const c = kameraPada(t);
  kamera.position.copy(c.pos); kamera.fov = c.fov; kamera.updateProjectionMatrix(); kamera.lookAt(c.target);
  renderer.render(scene, kamera);
  ctx.drawImage(renderer.domElement, 0, 0);
  overlay(t);
}

window.__studio = {
  durasi: DURASI, fps: FPS, ukuran: [W, H], judul: N.judul || 'animasi',
  frame, ambil: (tipe = 'image/jpeg', q = .93) => out.toDataURL(tipe, q),
  linimasa: daftar.flatMap(k => k.bicara.map(b => ({ siapa: k.d.id, mulai: b.t0, selesai: b.t1, teks: b.teks, audio: b.audio || null }))).sort((a, b) => a.mulai - b.mulai),
  adegan: adegan.map(a => ({ mulai: a.mulai, akhir: a.akhir, kamera: a.kamera }))
};

/* ======================= PEMUTAR & PEREKAM ======================== */
if (RENDER) { frame(0); window.__siap = true; }
else {
  const bMain = document.getElementById('bMain'), bUlang = document.getElementById('bUlang'), bRekam = document.getElementById('bRekam'),
    geser = document.getElementById('geser'), lw = document.getElementById('waktu');
  let main = false, waktu = 0, jangkar = 0, perekam = null, potongan = [];
  const setMain = v => { main = v; bMain.textContent = v ? '⏸ Jeda' : '▶ Putar'; if (v) jangkar = performance.now() - waktu * 1000; };
  bMain.onclick = () => { if (waktu >= DURASI) waktu = 0; setMain(!main); };
  bUlang.onclick = () => { waktu = 0; setMain(true); };
  geser.oninput = () => { waktu = geser.value / 1000 * DURASI; if (main) jangkar = performance.now() - waktu * 1000; };
  bRekam.onclick = () => {
    if (perekam) { perekam.stop(); return; }
    const tipe = ['video/mp4;codecs=avc1', 'video/webm;codecs=vp9', 'video/webm'].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m));
    if (!tipe) { alert('Browser ini belum mendukung perekaman video.'); return; }
    potongan = []; perekam = new MediaRecorder(out.captureStream(FPS), { mimeType: tipe, videoBitsPerSecond: 12e6 });
    perekam.ondataavailable = e => e.data.size && potongan.push(e.data);
    perekam.onstop = () => {
      const blob = new Blob(potongan, { type: tipe }), a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = (N.judul || 'animasi').replace(/\s+/g, '-') + (tipe.includes('mp4') ? '.mp4' : '.webm'); a.click();
      perekam = null; bRekam.classList.remove('aktif'); bRekam.textContent = '⏺ Rekam';
    };
    waktu = 0; setMain(true); perekam.start(250); bRekam.classList.add('aktif'); bRekam.textContent = '⏹ Stop';
  };
  const loop = now => {
    if (main) { waktu = (now - jangkar) / 1000; if (waktu >= DURASI) { waktu = DURASI; setMain(false); if (perekam) setTimeout(() => perekam && perekam.stop(), 300); } }
    frame(waktu); geser.value = Math.round(waktu / DURASI * 1000); lw.textContent = `${waktu.toFixed(1)} / ${DURASI.toFixed(1)}`;
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
</script>
